<app-navbar title="Programm"/>

<app-kalender (dateSelected)="waehleDatum($event)"/>

<div class="mx-4 mt-2 flex flex-wrap items-center gap-4">
  <label class="label cursor-pointer gap-2">
    <input type="checkbox" class="toggle toggle-primary"
           data-testid="filter-kinderfilme"
           [checked]="nurKinderfilme()"
           (change)="setzeNurKinderfilme($any($event.target).checked)"/>
    <span>Nur Kinderfilme</span>
  </label>

  <label class="flex items-center gap-2">
    <span>Sprache</span>
    <select class="select select-primary w-auto"
            data-testid="filter-sprache"
            (change)="setzeSprache($any($event.target).value)">
      <option value="" [selected]="sprache() === ''">Alle</option>
      @for (s of sprachenOptionen(); track s) {
        <option [value]="s" [selected]="sprache() === s">{{ anzeigename(s) }}</option>
      }
    </select>
  </label>
</div>

<div class="flex flex-col">
  @for (film of filme(); track film) {
    <app-programmeintrag [film]="film"/>
  } @empty {
    @if (filme()) {
      @if (sprache()) {
        <p class="m-4">An diesem Tag laufen keine Filme in dieser Sprache.</p>
      } @else if (nurKinderfilme()) {
        <p class="m-4">An diesem Tag laufen keine Kinderfilme.</p>
      }
    }
  }
</div>
